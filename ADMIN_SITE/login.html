1<!doctype html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Admin Login • TradeSim Pro</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      color: #ffffff;

      background:
        radial-gradient(
          circle at 50% 0%,
          #12466d 0%,
          #092b45 35%,
          #041522 70%,
          #020a11 100%
        );
    }


    /* =========================
       LOGIN WRAPPER
    ========================= */

    .loginPage {
      width: 100%;
      max-width: 430px;
      margin: auto;
    }


    /* =========================
       LOGIN CARD
    ========================= */

    .loginCard {

      width: 100%;

      padding: 34px;

      border-radius: 20px;

      background:
        linear-gradient(
          145deg,
          rgba(10, 39, 61, 0.97),
          rgba(4, 21, 34, 0.97)
        );

      border:
        1px solid
        rgba(85, 185, 255, 0.20);

      box-shadow:
        0 25px 70px
        rgba(0, 0, 0, 0.50);

      backdrop-filter: blur(12px);
    }


    /* =========================
       BRAND
    ========================= */

    .logo {

      margin-bottom: 9px;

      color: #62c8ff;

      font-size: 13px;

      font-weight: 800;

      letter-spacing: 1.5px;
    }


    /* =========================
       TITLE
    ========================= */

    h1 {

      margin: 0;

      font-size: 30px;

      line-height: 1.2;

      font-weight: 800;
    }


    .subtitle {

      margin-top: 9px;

      margin-bottom: 22px;

      color: #8daabd;

      font-size: 14px;

      line-height: 1.6;
    }


    /* =========================
       ADMIN BADGE
    ========================= */

    .adminBadge {

      display: inline-flex;

      align-items: center;

      justify-content: center;

      min-height: 28px;

      padding:
        5px
        11px;

      margin-bottom: 22px;

      border-radius: 999px;

      background:
        rgba(0, 153, 255, 0.13);

      border:
        1px solid
        rgba(67, 183, 255, 0.30);

      color: #63c7ff;

      font-size: 10px;

      font-weight: 800;

      letter-spacing: .6px;
    }


    /* =========================
       FORM
    ========================= */

    .field {

      width: 100%;

      margin-bottom: 17px;
    }


    .field label {

      display: block;

      margin-bottom: 7px;

      color: #c7d9e5;

      font-size: 13px;

      font-weight: 600;
    }


    .field input {

      display: block;

      width: 100%;

      height: 50px;

      padding:
        0
        14px;

      border:
        1px solid
        #24465d;

      border-radius: 10px;

      outline: none;

      background:
        #061521;

      color: #ffffff;

      font-size: 15px;

      transition:
        border-color .2s ease,
        box-shadow .2s ease,
        background .2s ease;
    }


    .field input::placeholder {

      color: #607d90;
    }


    .field input:focus {

      border-color:
        #159cff;

      background:
        #071a29;

      box-shadow:
        0 0 0 3px
        rgba(21, 156, 255, 0.12);
    }


    /* =========================
       LOGIN BUTTON
    ========================= */

    .loginBtn {

      display: flex;

      align-items: center;
      justify-content: center;

      width: 100%;

      height: 50px;

      margin-top: 5px;

      padding: 0 16px;

      border: none;

      border-radius: 10px;

      outline: none;

      background:
        linear-gradient(
          135deg,
          #168cff,
          #0069d9
        );

      color: #ffffff;

      font-size: 15px;

      font-weight: 700;

      cursor: pointer;

      transition:
        transform .15s ease,
        filter .15s ease,
        opacity .15s ease;
    }


    .loginBtn:hover {

      filter:
        brightness(1.10);

      transform:
        translateY(-1px);
    }


    .loginBtn:active {

      transform:
        translateY(0);
    }


    .loginBtn:disabled {

      opacity: .60;

      cursor:
        not-allowed;

      transform:
        none;
    }


    /* =========================
       MESSAGE
    ========================= */

    .message {

      min-height: 22px;

      margin-top: 15px;

      color: #ffbd5a;

      text-align: center;

      font-size: 13px;

      line-height: 1.5;
    }


    /* =========================
       BACK LINK
    ========================= */

    .back {

      display: block;

      margin-top: 19px;

      color: #7fa4ba;

      text-align: center;

      text-decoration: none;

      font-size: 13px;

      transition:
        color .2s ease;
    }


    .back:hover {

      color: #ffffff;
    }


    /* =========================
       SECURITY NOTE
    ========================= */

    .securityNote {

      margin-top: 24px;

      padding-top: 17px;

      border-top:
        1px solid
        rgba(100, 150, 180, 0.12);

      color: #59788b;

      text-align: center;

      font-size: 11px;

      line-height: 1.5;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 480px) {

      body {

        padding: 15px;
      }


      .loginCard {

        padding:
          27px
          21px;

        border-radius: 17px;
      }


      h1 {

        font-size: 26px;
      }


      .subtitle {

        font-size: 13px;
      }


      .field input,
      .loginBtn {

        height: 48px;
      }
    }


    /* =========================
       VERY SMALL SCREEN
    ========================= */

    @media (max-width: 340px) {

      .loginCard {

        padding:
          23px
          17px;
      }


      h1 {

        font-size: 23px;
      }
    }

  </style>

</head>


<body>


  <main class="loginPage">


    <section class="loginCard">


      <!-- BRAND -->

      <div class="logo">
        TRADESIM PRO
      </div>


      <!-- TITLE -->

      <h1>
        Admin Login
      </h1>


      <div class="subtitle">
        Sign in to access the administrator control panel.
      </div>


      <!-- ADMIN BADGE -->

      <div class="adminBadge">
        🔐 ADMIN ONLY
      </div>


      <!-- LOGIN FORM -->

      <form
        id="adminLoginForm"
        autocomplete="on"
      >


        <!-- EMAIL -->

        <div class="field">

          <label for="email">
            Admin Email
          </label>

          <input
            id="email"
            name="email"
            type="email"
            placeholder="Enter admin email"
            autocomplete="username"
            spellcheck="false"
            required
          >

        </div>


        <!-- PASSWORD -->

        <div class="field">

          <label for="password">
            Password
          </label>

          <input
            id="password"
            name="password"
            type="password"
            placeholder="Enter password"
            autocomplete="current-password"
            required
          >

        </div>


        <!-- LOGIN BUTTON -->

        <button
          id="loginBtn"
          class="loginBtn"
          type="submit"
        >
          Sign in to Admin
        </button>


      </form>


      <!-- ERROR / SUCCESS MESSAGE -->

      <div
        id="loginMsg"
        class="message"
        aria-live="polite"
      ></div>


      <!-- USER LOGIN -->

      <a
        class="back"
        href="../USER_SITE/login.html"
      >
        ← Back to User Login
      </a>


      <!-- SECURITY -->

      <div class="securityNote">
        Authorized administrator access only.
      </div>


    </section>


  </main>


  <!--
    Firebase Admin Login Script

    IMPORTANT:
    login.js must redirect to:

    index.html

    NOT dashboard.html
  -->

  <script
    type="module"
    src="js/login.js"
  ></script>


</body>

</html>
